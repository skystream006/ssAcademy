name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check reading content generation
        run: python3 -m unittest discover -s datasets/reading -p 'test_*.py'
      - name: Test, lint, and build debug APK
        run: sh ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: ssAcademy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
