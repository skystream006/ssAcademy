name: Cleanup Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: cleanup-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all but the five newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Include drafts and prereleases; use creation time for unpublished drafts.
          release_ids=$(gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
            | jq -r 'flatten | sort_by(.published_at // .created_at, .id) | reverse | .[5:][] | .id')

          if [ -z "$release_ids" ]; then
            echo "Five or fewer releases found; nothing to delete."
            exit 0
          fi

          # Delete releases and their assets, leaving Git tags intact.
          while IFS= read -r release_id; do
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}"
            echo "Deleted release ${release_id}."
          done <<< "$release_ids"
