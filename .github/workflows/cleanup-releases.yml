name: Cleanup Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: cleanup-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all but the five newest releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Include drafts and prereleases; use creation time for unpublished drafts.
          release_tags=$(gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
            | jq -r 'flatten | sort_by(.published_at // .created_at, .id) | reverse | .[5:][] | .tag_name')

          if [ -z "$release_tags" ]; then
            echo "Five or fewer releases found; nothing to delete."
            exit 0
          fi

          # Delete releases, their assets, and their associated Git tags.
          while IFS= read -r tag; do
            gh release delete --yes --cleanup-tag -- "$tag"
            echo "Deleted release and tag ${tag}."
          done <<< "$release_tags"
